{% extends "base.html" %}
{% block title %}Events{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Events</h1>
    <p class="muted">{{ events|length }} event{{ '' if events|length == 1 else 's' }} found</p>
  </div>
  <a class="btn btn-primary" href="{{ url_for('event_new') }}">+ New event</a>
</div>

<form class="filters card" method="get" action="{{ url_for('events_list') }}">
  <input type="search" name="q" value="{{ q }}" placeholder="Search title, place or description">
  <select name="category" aria-label="Category">
    <option value="">All categories</option>
    {% for c in categories %}
      <option value="{{ c }}" {{ 'selected' if c == category }}>{{ c }}</option>
    {% endfor %}
  </select>
  <select name="when" aria-label="When">
    <option value="upcoming" {{ 'selected' if when == 'upcoming' }}>Upcoming</option>
    <option value="past" {{ 'selected' if when == 'past' }}>Past</option>
    <option value="all" {{ 'selected' if when == 'all' }}>All dates</option>
  </select>
  <button class="btn" type="submit">Filter</button>
</form>

{% include "_event_cards.html" %}
{% endblock %}
